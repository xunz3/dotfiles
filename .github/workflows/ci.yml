name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -path './bin/dot' -o -path './bin/clipboard-copy' -o -path './bin/git-pager' -o -path './script/bootstrap' -o -path './script/install' \) -print0)
      - name: Run isolated tests
        run: bash test/run.sh
